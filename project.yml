name: Homericc
options:
  bundleIdPrefix: com.meric5488
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: fr
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Homericc:
    type: application
    platform: iOS
    sources:
      - Homericc
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.meric5488.Homericc
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Homericc/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Homericc
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Homericc se connecte à tes serveurs (Radarr, Sonarr, Plex…) sur ton réseau local."
