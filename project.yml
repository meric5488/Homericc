name: Homericc
options:
  bundleIdPrefix: com.meric5488
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: fr
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Homericc:
    type: application
    platform: macOS
    sources:
      - Homericc
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.meric5488.Homericc
        PRODUCT_NAME: Homericc
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Homericc/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Homericc
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Homericc se connecte à tes serveurs (Radarr, Sonarr, Plex…) sur ton réseau local."
